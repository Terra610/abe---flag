<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A.B.E. — American Butterfly Effect</title>
  <link rel="stylesheet" href="assets/theme.css">
</head>
<body>
  <div class="header">
    <h1>A.B.E. — American Butterfly Effect</h1>
    <div class="tagline">Constitution • Integrity • Recovery • All Local</div>
    <div class="global-controls">
      <button onclick="resetAll()">Reset</button>
      <button onclick="clearData()">Clear Data</button>
      <button onclick="downloadAuditHash()">Download Audit Hash</button>
    </div>
  </div>

  <div id="pipeline-status" class="pipeline-status">
    Current Step: <span id="current-step">Intake</span>
  </div>

  <div id="module-container" class="module-container"></div>

  <!-- Global AI Assistant -->
  <div class="ai-assistant">
    <h3>ABE Assistant</h3>
    <div id="ai-chat" class="ai-chat"></div>
    <input type="text" id="ai-input" placeholder="Ask about the current output..." onkeypress="if(event.key === 'Enter') askAI()">
    <button onclick="askAI()">Ask</button>
  </div>

  <script src="engine/core/session.js"></script>
  <script>
    const firingOrder = ["intake", "cae", "cda", "ccri", "cff", "affe", "ciri", "cibs", "cii", "macro", "doctrines"];
    let currentIndex = 0;

    async function runNextModule() {
      const moduleName = firingOrder[currentIndex];
      document.getElementById('current-step').textContent = moduleName.toUpperCase();

      const container = document.getElementById('module-container');
      container.innerHTML = `<div class="loading">Running ${moduleName.toUpperCase()}...</div>`;

      try {
        const mod = await import(`./engine/modules/${moduleName}/index.js`);
        container.innerHTML = '';
        mod.renderUI(container);
      } catch (err) {
        container.innerHTML = `<div class="error">Failed to run ${moduleName}.<br>${err.message}</div>`;
      }
    }

    function goToNext() {
      currentIndex = (currentIndex + 1) % firingOrder.length;
      runNextModule();
    }

    function resetAll() {
      if (confirm("Reset all data and start over?")) {
        localStorage.clear();
        currentIndex = 0;
        runNextModule();
      }
    }

    function clearData() {
      if (confirm("Clear current data?")) {
        localStorage.removeItem('ABE_FLAG_SCENARIO_V1');
        runNextModule();
      }
    }

    async function downloadAuditHash() {
      const s = getOrCreateScenario ? getOrCreateScenario() : {};
      const hash = await (typeof hashObject === 'function' ? hashObject(s) : Promise.resolve("No hash function"));
      const filename = `ABE_Audit_${new Date().toISOString().slice(0,19)}.txt`;
      const blob = new Blob([`ABE Audit Hash:\n${hash}`], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    // Simple AI Assistant
    function askAI() {
      const input = document.getElementById('ai-input');
      const chat = document.getElementById('ai-chat');
      if (!input.value.trim()) return;
      chat.innerHTML += `<p><strong>You:</strong> ${input.value}</p>`;
      const response = "ABE Assistant: The engine follows a fixed firing order. Check the current module output or ask about constitutional alignment.";
      chat.innerHTML += `<p><strong>ABE:</strong> ${response}</p>`;
      input.value = '';
      chat.scrollTop = chat.scrollHeight;
    }

    // Start the pipeline
    window.onload = () => {
      runNextModule();
    };
  </script>
</body>
</html>
