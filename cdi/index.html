<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <base href="/abe---flag/">
  <title>CDI • A.B.E.</title>
  <link rel="stylesheet" href="assets/theme.css">
</head>
<body>
  <main class="wrap">
    <header class="header">
      <div>
        <h1>CDI</h1>
        <p class="tagline">Constitution Divergence Index</p>
      </div>
      <nav class="module-nav">
        <a href="/abe---flag/index.html"><button>Home</button></a>
        <a href="/abe---flag/integration/index.html"><button>Integration</button></a>
      </nav>
    </header>

    <section class="panel">
      <h2>Overview</h2>
      <p>
        CDI quantifies constitutional divergence across weighted domains and classifies
        the severity of deviation from constitutional fidelity.
      </p>
    </section>

    <section class="grid cols-2">
      <section class="card">
        <h2>Module Output</h2>
        <pre id="output">Loading…</pre>
      </section>

      <section class="card">
        <h2>Plain Language</h2>
        <pre id="plain">Loading…</pre>
      </section>
    </section>
  </main>

  <script>
    const artifact = JSON.parse(localStorage.getItem("abe_cdi_artifact") || "null");
    document.getElementById("output").textContent = artifact
      ? JSON.stringify(artifact.result || artifact, null, 2)
      : "No CDI artifact available yet.";
    document.getElementById("plain").textContent = artifact
      ? JSON.stringify(artifact.plain_language || {}, null, 2)
      : "No plain-language explanation available yet.";
  </script>
</body>
</html>
