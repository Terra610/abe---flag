<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Intake — ABE Entry Interface</title>

  <base href="/abe---flag/">

  <style>
    :root{
      --bg:#0b0d12;
      --panel:#141820;
      --panel2:#10151d;
      --ink:#e6e6e6;
      --muted:#9fb3c8;
      --line:rgba(255,255,255,.08);
      --ok:#4bd28f;
      --warn:#ffd166;
      --bad:#ff6b6b;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font:16px/1.6 system-ui;
    }

    header{
      padding:20px;
      text-align:center;
      background:#11151c;
      border-bottom:1px solid var(--line);
    }

    a{color:#80bfff;text-decoration:none}

    .nav{
      margin-top:10px;
      display:flex;
      justify-content:center;
      gap:10px;
      flex-wrap:wrap;
    }

    .nav a{
      padding:8px 12px;
      border:1px solid var(--line);
      border-radius:999px;
      background:var(--panel2);
    }

    main{
      max-width:1000px;
      margin:20px auto;
      padding:0 16px;
    }

    .card{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:12px;
      padding:16px;
      margin:12px 0;
    }

    textarea{
      width:100%;
      min-height:180px;
      background:#0f141b;
      color:var(--ink);
      border:1px solid var(--line);
      border-radius:10px;
      padding:10px;
      font-family:monospace;
    }

    .row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:10px;
    }

    button{
      background:#10151d;
      color:var(--ink);
      border:1px solid var(--line);
      border-radius:10px;
      padding:10px 14px;
      cursor:pointer;
    }

    .status{
      margin-top:10px;
      font-size:.9rem;
      color:var(--muted);
    }

    pre{
      white-space:pre-wrap;
      background:#0f141b;
      border:1px solid var(--line);
      border-radius:10px;
      padding:12px;
    }
  </style>
</head>

<body>

<header>
  <h1>📥 Intake — ABE Entry Interface</h1>
  <div>Normalize inputs → generate intake artifact → feed pipeline</div>

  <div class="nav">
    <a href="index.html">Home</a>
    <a href="integration/index.html">Integration</a>
    <a href="system/index.html">CLI</a>
  </div>
</header>

<main>

  <section class="card">
    <h3>Paste Input (JSON or Text)</h3>
    <textarea id="input"></textarea>

    <div class="row">
      <button id="btn-parse">Parse Input</button>
      <button id="btn-clear">Clear</button>
    </div>

    <div class="status" id="status">Waiting for input…</div>
  </section>

  <section class="card">
    <h3>Generated Intake Artifact</h3>
    <pre id="output">—</pre>

    <div class="row">
      <button id="btn-save" disabled>Save to Engine</button>
      <button id="btn-download" disabled>Download JSON</button>
    </div>
  </section>

</main>

<script>
const inputEl = document.getElementById("input");
const outputEl = document.getElementById("output");
const statusEl = document.getElementById("status");

let artifact = null;

function safeParse(text){
  try { return JSON.parse(text); }
  catch { return null; }
}

function createArtifact(data){
  return {
    module: "INTAKE",
    version: "1.0",
    timestamp: new Date().toISOString(),
    hash: crypto.randomUUID(),
    payload: data
  };
}

document.getElementById("btn-parse").onclick = () => {
  const raw = inputEl.value.trim();

  if(!raw){
    statusEl.textContent = "No input provided.";
    return;
  }

  let parsed = safeParse(raw);

  if(!parsed){
    parsed = { raw_text: raw };
  }

  artifact = createArtifact(parsed);

  outputEl.textContent = JSON.stringify(artifact, null, 2);

  statusEl.textContent = "Input normalized and artifact created.";

  document.getElementById("btn-save").disabled = false;
  document.getElementById("btn-download").disabled = false;
};

document.getElementById("btn-clear").onclick = () => {
  inputEl.value = "";
  outputEl.textContent = "—";
  statusEl.textContent = "Cleared.";
};

document.getElementById("btn-save").onclick = () => {
  if(!artifact) return;

  localStorage.setItem("ABE_INTAKE_ARTIFACT_V1", JSON.stringify(artifact));
  localStorage.setItem("abe_intake_artifact", JSON.stringify(artifact));

  statusEl.textContent = "Saved to engine. Ready for pipeline.";
};

document.getElementById("btn-download").onclick = () => {
  if(!artifact) return;

  const blob = new Blob([JSON.stringify(artifact,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "ABE_INTAKE_ARTIFACT_V1.json";
  a.click();

  URL.revokeObjectURL(url);
};
</script>

</body>
</html>
