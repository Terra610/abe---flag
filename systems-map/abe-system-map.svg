<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0b0d12; }
    .panel { fill: #161c28; stroke: #232b3a; stroke-width: 2; rx: 14; }
    .doctrine { fill: #121722; stroke: #2f6fcc; stroke-width: 2; rx: 14; }
    .text { fill: #e8ecf1; font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: 700; }
    .sub { fill: #9aa4b2; font-family: Arial, Helvetica, sans-serif; font-size: 14px; }
    .line { stroke: #5aa9ff; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    .dline { stroke: #9aa4b2; stroke-width: 2; fill: none; stroke-dasharray: 7 7; marker-end: url(#arrow2); }
    .title { fill: #e8ecf1; font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 800; }
  </style>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5aa9ff"/>
    </marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#9aa4b2"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="900"/>

  <text class="title" x="60" y="55">A.B.E. System Map</text>
  <text class="sub" x="60" y="82">Deterministic constitutional measurement engine</text>

  <!-- doctrine row -->
  <rect class="doctrine" x="60" y="120" width="220" height="90"/>
  <text class="text" x="80" y="155">Constitutional</text>
  <text class="text" x="80" y="180">Fidelity</text>

  <rect class="doctrine" x="320" y="120" width="220" height="90"/>
  <text class="text" x="340" y="155">Void Ab</text>
  <text class="text" x="340" y="180">Initio</text>

  <rect class="doctrine" x="580" y="120" width="220" height="90"/>
  <text class="text" x="600" y="155">ABE-CRRA</text>

  <rect class="doctrine" x="840" y="120" width="220" height="90"/>
  <text class="text" x="860" y="155">Justice</text>
  <text class="text" x="860" y="180">Monopoly</text>

  <rect class="doctrine" x="1100" y="120" width="320" height="90"/>
  <text class="text" x="1120" y="155">Constitutional Systems</text>
  <text class="text" x="1120" y="180">Engineering</text>

  <!-- module row -->
  <rect class="panel" x="60" y="360" width="150" height="90"/>
  <text class="text" x="95" y="395">Intake</text>
  <text class="sub" x="78" y="420">data ingestion</text>

  <rect class="panel" x="240" y="360" width="150" height="90"/>
  <text class="text" x="285" y="395">CDA</text>
  <text class="sub" x="255" y="420">divergence</text>

  <rect class="panel" x="420" y="360" width="150" height="90"/>
  <text class="text" x="465" y="395">CFF</text>
  <text class="sub" x="445" y="420">funding</text>

  <rect class="panel" x="600" y="360" width="150" height="90"/>
  <text class="text" x="640" y="395">AFFE</text>
  <text class="sub" x="622" y="420">cost</text>

  <rect class="panel" x="780" y="360" width="150" height="90"/>
  <text class="text" x="825" y="395">CIRI</text>
  <text class="sub" x="800" y="420">recovery</text>

  <rect class="panel" x="960" y="360" width="150" height="90"/>
  <text class="text" x="1005" y="395">CIBS</text>
  <text class="sub" x="972" y="420">behavior</text>

  <rect class="panel" x="1140" y="360" width="150" height="90"/>
  <text class="text" x="1190" y="395">CII</text>
  <text class="sub" x="1162" y="420">unified output</text>

  <rect class="panel" x="1320" y="360" width="180" height="90"/>
  <text class="text" x="1365" y="395">Macro</text>
  <text class="sub" x="1340" y="420">aggregate scaling</text>

  <!-- chain arrows -->
  <path class="line" d="M210 405 L240 405"/>
  <path class="line" d="M390 405 L420 405"/>
  <path class="line" d="M570 405 L600 405"/>
  <path class="line" d="M750 405 L780 405"/>
  <path class="line" d="M930 405 L960 405"/>
  <path class="line" d="M1110 405 L1140 405"/>
  <path class="line" d="M1290 405 L1320 405"/>

  <!-- doctrine links -->
  <path class="dline" d="M170 210 C170 280, 300 290, 315 360"/>
  <path class="dline" d="M430 210 C430 280, 300 290, 315 360"/>

  <path class="dline" d="M170 210 C170 290, 495 290, 495 360"/>
  <path class="dline" d="M430 210 C430 290, 495 290, 495 360"/>
  <path class="dline" d="M1260 210 C1260 290, 495 290, 495 360"/>

  <path class="dline" d="M690 210 C690 290, 855 290, 855 360"/>
  <path class="dline" d="M690 210 C690 290, 1035 290, 1035 360"/>
  <path class="dline" d="M690 210 C690 290, 1410 290, 1410 360"/>

  <path class="dline" d="M950 210 C950 290, 315 290, 315 360"/>
  <path class="dline" d="M950 210 C950 290, 495 290, 495 360"/>
  <path class="dline" d="M950 210 C950 290, 1410 290, 1410 360"/>

  <path class="dline" d="M1260 210 C1260 290, 315 290, 315 360"/>
  <path class="dline" d="M1260 210 C1260 290, 495 290, 495 360"/>
  <path class="dline" d="M1260 210 C1260 290, 1215 290, 1215 360"/>
  <path class="dline" d="M1260 210 C1260 290, 1410 290, 1410 360"/>

  <!-- legend -->
  <rect class="panel" x="60" y="700" width="1480" height="120"/>
  <text class="text" x="90" y="740">Flow</text>
  <text class="sub" x="90" y="765">Input → validation → funding → cost → recovery → behavior → output → macro</text>
  <text class="text" x="90" y="800">Doctrine Role</text>
  <text class="sub" x="90" y="825">Doctrine defines constraints. Modules apply constraints. Outputs quantify divergence and recovery.</text>
</svg>
