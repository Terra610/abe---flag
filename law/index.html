<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Law — Authority Layer</title>

<base href="/abe---flag/">

<style>
:root{
  --bg:#0b0d12;
  --panel:#141820;
  --panel2:#10151d;
  --ink:#e6e6e6;
  --muted:#9fb3c8;
  --line:rgba(255,255,255,.08);
  --ok:#4bd28f;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:16px/1.6 system-ui;
}
header{
  padding:20px;
  text-align:center;
  background:#11151c;
  border-bottom:1px solid var(--line);
}
.nav{
  margin-top:10px;
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}
.nav a{
  padding:8px 12px;
  border:1px solid var(--line);
  border-radius:999px;
  background:var(--panel2);
  color:#80bfff;
  text-decoration:none;
}
main{
  max-width:1100px;
  margin:20px auto;
  padding:0 16px;
}
.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:12px;
  padding:14px;
  margin:12px 0;
}
.list{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:10px;
}
.item{
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px;
  cursor:pointer;
}
.item:hover{border-color:#5ddfff}
pre{
  white-space:pre-wrap;
  background:#0f141b;
  border:1px solid var(--line);
  border-radius:10px;
  padding:12px;
}
</style>
</head>

<body>

<header>
  <h1>⚖️ Law — Authority Layer</h1>
  <div>Structured federal authority + doctrine mapping for ABE</div>

  <div class="nav">
    <a href="index.html">Home</a>
    <a href="doctrine/index.html">Doctrines</a>
    <a href="integration/index.html">Integration</a>
  </div>
</header>

<main>

<div class="card">
  <h3>Available Authority Sets</h3>
  <div class="list" id="list"></div>
</div>

<div class="card">
  <h3>Selected Authority</h3>
  <pre id="viewer">Select a dataset…</pre>
</div>

</main>

<script>
const FILES = [
  "law/title_49_transport.json",
  "law/title_49_mcsap.json",
  "law/fmcsr_scope.json",
  "law/mcsap_rules.json",
  "law/doctrine_map.json"
];

const listEl = document.getElementById("list");
const viewerEl = document.getElementById("viewer");

async function loadFile(path){
  const r = await fetch(path,{cache:'no-store'});
  if(!r.ok) throw new Error(path+" "+r.status);
  return r.json();
}

FILES.forEach(path=>{
  const div = document.createElement("div");
  div.className = "item";
  div.textContent = path.split("/").pop();

  div.onclick = async ()=>{
    try{
      viewerEl.textContent = "Loading…";
      const data = await loadFile(path);
      viewerEl.textContent = JSON.stringify(data,null,2);
    }catch(e){
      viewerEl.textContent = e.message;
    }
  };

  listEl.appendChild(div);
});
</script>

</body>
</html>
