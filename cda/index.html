<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <base href="/abe---flag/">
  <title>CDA • A.B.E.</title>
  <link rel="stylesheet" href="assets/theme.css">
</head>
<body>
  <main class="wrap">
    <header class="header">
      <div>
        <h1>CDA</h1>
        <p class="tagline">Constitutional Determination Audit</p>
      </div>
      <nav class="module-nav">
        <a href="/abe---flag/index.html"><button>Home</button></a>
        <a href="/abe---flag/integration/index.html"><button>Integration</button></a>
      </nav>
    </header>

    <section class="panel">
      <h2>Overview</h2>
      <p>
        CDA identifies claimed authority, controlling authority, jurisdiction status,
        doctrine triggers, rights burdens, and whether the conduct is ultra vires,
        off-mission, or void ab initio.
      </p>
    </section>

    <section class="grid cols-2">
      <section class="card">
        <h2>Module Output</h2>
        <pre id="output">Loading…</pre>
      </section>

      <section class="card">
        <h2>Plain Language</h2>
        <pre id="plain">Loading…</pre>
      </section>
    </section>
  </main>

  <script>
    const artifact = JSON.parse(localStorage.getItem("abe_cda_artifact") || "null");
    document.getElementById("output").textContent = artifact
      ? JSON.stringify(artifact.result || artifact, null, 2)
      : "No CDA artifact available yet.";
    document.getElementById("plain").textContent = artifact
      ? JSON.stringify(artifact.plain_language || {}, null, 2)
      : "No plain-language explanation available yet.";
  </script>
</body>
</html>
